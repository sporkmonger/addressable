version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # The CodeQL sub-actions have to run the same version, so update them
      # together.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
