name: Release

on:
  push:
    tags:
      - addressable-*

jobs:
  # the full CI workflow must pass before anything is published
  test:
    if: github.repository == 'sporkmonger/addressable'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    if: github.repository == 'sporkmonger/addressable'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for trusted publishing
    steps:
      # tags are named addressable-VERSION, e.g. addressable-2.8.6
      - name: Set VERSION from git tag
        env:
          GIT_REF: ${{ github.ref }}
        run: echo "VERSION=${GIT_REF##*addressable-}" >> "$GITHUB_ENV"

      - name: Install libidn
        run: sudo apt-get install libidn11-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
        with:
          bundler-cache: true
          ruby-version: ruby

      - name: Verify tag matches gemspec version
        run: |
          GEMSPEC_VERSION=$(ruby -e "puts Gem::Specification.load('addressable.gemspec').version")
          if [ "$VERSION" != "$GEMSPEC_VERSION" ]; then
            echo "ERROR: tag version ($VERSION) does not match gemspec version ($GEMSPEC_VERSION)"
            exit 1
          fi

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # ensure gem can be built and installed
      - run: bundle exec rake gem:install

      # push gem to rubygems.org
      - run: gem push --verbose pkg/addressable-${VERSION}.gem
