name: Release

on:
  push:
    tags:
      - addressable-*

jobs:
  # only commits that are on main are published, however the tag was made
  verify-tag:
    if: github.repository == 'sporkmonger/addressable'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi

  # the full CI workflow must pass before anything is published
  test:
    needs: verify-tag
    if: github.repository == 'sporkmonger/addressable'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  # Builds the gem from the committed gemspec without installing the bundle,
  # so no third-party gem's code runs before the gem is packaged. This job
  # can't publish: it has no id-token permission.
  build:
    needs: test
    if: github.repository == 'sporkmonger/addressable'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # tags are named addressable-VERSION, e.g. addressable-2.8.6
      - name: Set VERSION from git tag
        env:
          GIT_REF: ${{ github.ref }}
        run: echo "VERSION=${GIT_REF##*addressable-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          bundler-cache: false
          ruby-version: ruby

      - name: Verify tag matches gemspec version
        run: |
          GEMSPEC_VERSION=$(ruby -e "puts Gem::Specification.load('addressable.gemspec').version")
          if [ "$VERSION" != "$GEMSPEC_VERSION" ]; then
            echo "ERROR: tag version ($VERSION) does not match gemspec version ($GEMSPEC_VERSION)"
            exit 1
          fi

      # The gemspec job in CI checks that addressable.gemspec matches the
      # Rakefile's, so this builds the same gem as rake gem:package.
      - name: Build gem
        run: |
          mkdir pkg
          gem build addressable.gemspec --output "pkg/addressable-${VERSION}.gem"
          sha256sum "pkg/addressable-${VERSION}.gem"

      # ensure the gem can be installed; its dependency isn't needed for that
      - name: Install gem
        run: gem install --local --ignore-dependencies --no-document "pkg/addressable-${VERSION}.gem"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem
          path: pkg/addressable-${{ env.VERSION }}.gem
          if-no-files-found: error
          retention-days: 7

  # Pushes the gem the build job made. Only this job can mint the trusted
  # publishing token, and it runs no code from the repository or its bundle.
  publish:
    needs: build
    if: github.repository == 'sporkmonger/addressable'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for trusted publishing
    steps:
      - name: Set VERSION from git tag
        env:
          GIT_REF: ${{ github.ref }}
        run: echo "VERSION=${GIT_REF##*addressable-}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem
          path: pkg

      - run: sha256sum "pkg/addressable-${VERSION}.gem"

      - uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          bundler-cache: false
          ruby-version: ruby

      - uses: rubygems/configure-rubygems-credentials@c6ca7f4bac0e29c9bde8eeae0a0a986b27efa05f # v2.2.0

      # push gem to rubygems.org
      - run: gem push --verbose "pkg/addressable-${VERSION}.gem"
